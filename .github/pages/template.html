<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply a saved theme choice before first paint; without one, prefers-color-scheme decides.
    (function () {
      try {
        var t = window.localStorage.getItem("maop-docs-theme");
        if (t === "light" || t === "dark") { document.documentElement.setAttribute("data-theme", t); }
      } catch (e) { /* storage unavailable: follow the system preference */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
  <style>
    :root {
      --bg: #F5F8FC; --surface: #FFFFFF; --surface-2: #EDF2FA; --border: #C9D5E8;
      --text: #0A1838; --muted: #44557A; --link: #1F5EFF; --accent: #007C99;
      --teal: #0B7A6B; --purple: #6B3FD4; --code-bg: #EDF2FA; --code-text: #0A1838;
      --header-bg: #07122B; --header-2: #0A1838; --header-text: #EAF1FF; --header-muted: #A9BBDE;
      --focus: #007C99; --paper: #FFFCF5; --note-bg: #E8F4F8; --warn-bg: #FFF4E0; --warn: #8A5200;
      --shadow: 0 1px 2px rgba(7, 18, 43, 0.06), 0 4px 16px rgba(7, 18, 43, 0.06);
      --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #07122B; --surface: #0A1838; --surface-2: #0D1D40; --border: #274079;
        --text: #EAF1FF; --muted: #A9BBDE; --link: #7CA4FF; --accent: #22D3EE;
        --teal: #2DD4BF; --purple: #A78BFA; --code-bg: #0D1D40; --code-text: #EAF1FF;
        --header-bg: #040B1C; --header-2: #07122B; --focus: #22D3EE; --note-bg: #0D2440;
        --warn-bg: #2A2110; --warn: #FBBF24; --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #07122B; --surface: #0A1838; --surface-2: #0D1D40; --border: #274079;
      --text: #EAF1FF; --muted: #A9BBDE; --link: #7CA4FF; --accent: #22D3EE;
      --teal: #2DD4BF; --purple: #A78BFA; --code-bg: #0D1D40; --code-text: #EAF1FF;
      --header-bg: #040B1C; --header-2: #07122B; --focus: #22D3EE; --note-bg: #0D2440;
      --warn-bg: #2A2110; --warn: #FBBF24; --shadow: none;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.65 var(--font); }
    a { color: var(--link); text-underline-offset: 2px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
    .skip { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--surface); color: var(--text);
            padding: 8px 14px; border-radius: 6px; }
    .skip:focus { top: 8px; }

    /* Header */
    .site-header { position: sticky; top: 0; z-index: 10; background: var(--header-bg); color: var(--header-text);
                   border-bottom: 3px solid #1F5EFF; }
    .header-inner { display: flex; align-items: center; gap: 12px; max-width: 1280px; margin: 0 auto; padding: 10px 16px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--header-text); text-decoration: none; font-weight: 700;
             font-size: 1.05rem; letter-spacing: 0.01em; min-width: 0; }
    .brand-mark { flex: none; width: 28px; height: 28px; }
    .brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--header-2); color: var(--header-text);
            border: 1px solid #274079; border-radius: 8px; padding: 6px 10px; font: 600 0.85rem var(--font);
            cursor: pointer; text-decoration: none; min-height: 36px; }
    .hbtn:hover { border-color: #22D3EE; }
    .hbtn:focus-visible { outline-color: #22D3EE; }
    .hbtn svg { width: 18px; height: 18px; }
    .menu-btn { display: none; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
    .sidebar { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto;
               padding: 24px 12px 32px 16px; border-right: 1px solid var(--border); }
    .nav-group { margin: 18px 8px 6px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
                 color: var(--muted); }
    .nav-group:first-child { margin-top: 0; }
    .nav-list { list-style: none; margin: 0; padding: 0; }
    .nav-list a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none;
                  font-size: 0.93rem; line-height: 1.35; border-left: 3px solid transparent; }
    .nav-list a:hover { background: var(--surface-2); }
    .nav-list a[aria-current="page"] { background: var(--surface-2); border-left-color: var(--accent); font-weight: 700; }
    .content-wrap { min-width: 0; padding: 32px 40px 64px; }
    .kicker { margin: 0 0 4px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    main { max-width: 820px; overflow-wrap: anywhere; }

    /* Content */
    main h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 16px; letter-spacing: -0.01em; }
    main h2 { font-size: 1.5rem; line-height: 1.3; margin: 40px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); }
    main h3 { font-size: 1.2rem; margin: 28px 0 8px; }
    main h4 { font-size: 1.05rem; margin: 22px 0 6px; }
    main h2, main h3, main h4 { scroll-margin-top: 72px; }
    .anchor { margin-left: 8px; color: var(--muted); text-decoration: none; font-weight: 400; opacity: 0; }
    h2:hover .anchor, h3:hover .anchor, .anchor:focus { opacity: 1; }
    main p, main li { max-width: 72ch; }
    main li + li { margin-top: 4px; }
    main strong { font-weight: 700; }
    code, pre { font-family: var(--mono); font-size: 0.86em; }
    :not(pre) > code { background: var(--code-bg); color: var(--code-text); padding: 0.1em 0.35em; border-radius: 4px;
                       border: 1px solid var(--border); }
    a > code { color: var(--link) !important; }
    .code-block { position: relative; margin: 16px 0; }
    .code-block pre { margin: 0; background: var(--code-bg); color: var(--code-text); padding: 14px 16px; padding-right: 76px;
                      overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); line-height: 1.55; }
    .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--surface); color: var(--text);
                border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font: 600 0.75rem var(--font);
                cursor: pointer; min-height: 28px; }
    .copy-btn:hover { border-color: var(--accent); }
    .copy-btn.copied { color: var(--teal); border-color: var(--teal); }
    .diagram { margin: 20px 0; padding: 16px; background: var(--paper); border: 1px solid var(--border); border-radius: 10px;
               overflow-x: auto; text-align: center; box-shadow: var(--shadow); }
    .diagram pre.mermaid { margin: 0; background: none; border: 0; padding: 0; color: #1F1F1F; }
    .diagram svg { max-width: 100%; height: auto; }
    table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 16px 0; font-size: 0.93rem; }
    th, td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top;
             overflow-wrap: normal; min-width: 7.5rem; }
    td code { overflow-wrap: anywhere; }
    th { background: var(--surface-2); }
    td { background: var(--surface); }
    blockquote { margin: 18px 0; padding: 10px 16px; background: var(--note-bg); border-left: 4px solid var(--accent);
                 border-radius: 0 8px 8px 0; }
    blockquote p { margin: 6px 0; }
    blockquote.warn { background: var(--warn-bg); border-left-color: var(--warn); }
    img { max-width: 100%; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
    noscript pre { white-space: pre-wrap; }

    /* Pager and footer */
    .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 820px; margin-top: 48px; }
    .pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; background: var(--surface);
               border: 1px solid var(--border); border-radius: 10px; text-decoration: none; color: var(--text); }
    .pager a:hover { border-color: var(--link); }
    .pager-next { grid-column: 2; text-align: right; }
    .pager-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .pager-title { color: var(--link); font-weight: 700; }
    .page-footer { max-width: 820px; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
                   font-size: 0.88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 20px; }
    .page-footer a { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .menu-btn { display: inline-flex; }
      .sidebar { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--border);
                 background: var(--surface); padding: 16px; }
      body.nav-open .sidebar { display: block; }
      .content-wrap { padding: 24px 16px 48px; }
      main h1 { font-size: 1.7rem; }
      .hbtn .label { display: none; }
    }
    @media (max-width: 520px) {
      .pager { grid-template-columns: minmax(0, 1fr); }
      .pager-next { grid-column: 1; }
      .brand { font-size: 0.95rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="hbtn menu-btn" type="button" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Site navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="brand" href="{{HOME}}">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="7" fill="#1F5EFF"/>
          <circle cx="9" cy="11" r="3" fill="#EAF1FF"/><circle cx="16" cy="9" r="3" fill="#22D3EE"/><circle cx="23" cy="11" r="3" fill="#EAF1FF"/>
          <rect x="6" y="19" width="20" height="6" rx="2" fill="#EAF1FF"/>
          <path d="M9 14v5M16 12v7M23 14v5" stroke="#EAF1FF" stroke-width="1.6"/>
        </svg>
        <span>{{PRODUCT}}</span>
      </a>
      <div class="header-actions">
        <button class="hbtn" type="button" id="theme-btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          <span class="label" id="theme-label">Dark</span>
        </button>
        <a class="hbtn" href="{{REPO_URL}}">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
          <span class="label">GitHub</span>
        </a>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Site">{{NAV}}</nav>
    <div class="content-wrap">
      <p class="kicker">{{KICKER}}</p>
      <main id="content" tabindex="-1"><noscript><p>JavaScript renders this page; raw Markdown follows.</p></noscript></main>
      {{PAGER}}
      <footer class="page-footer">
        <a href="{{SOURCE_URL}}">View this page's source on GitHub</a>
        <span>A demonstration, not a production system. Tool data is synthetic; remediation is simulated.</span>
      </footer>
    </div>
  </div>
  <div class="sr-only" aria-live="polite" id="live"></div>
  <script type="text/markdown" id="source">{{MARKDOWN}}</script>
  <!-- Pinned versions with Subresource Integrity. Mermaid v11+ is required for look: handDrawn. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"
          integrity="sha384-nCN5FOaVTXXYilftBH/VQuC9ypBYOxrctAZn2x7ggYClXaporWSzM0y+ODhb8MTi"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js"
          integrity="sha384-8xUhuLNMjW/cI2Dacg3DR4WliYznvIg0LVG1stctThKD/YVrJFI9TNCFxft5NYgp"
          crossorigin="anonymous"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var live = document.getElementById("live");

      // Theme toggle (persisted; storage failures are ignored).
      var themeBtn = document.getElementById("theme-btn");
      var themeLabel = document.getElementById("theme-label");
      function effectiveTheme() {
        var t = root.getAttribute("data-theme");
        if (t === "light" || t === "dark") { return t; }
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function syncThemeButton() {
        var dark = effectiveTheme() === "dark";
        themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
        themeBtn.setAttribute("aria-label", dark ? "Dark theme on; switch to light theme" : "Light theme on; switch to dark theme");
        themeLabel.textContent = dark ? "Light" : "Dark";
      }
      themeBtn.addEventListener("click", function () {
        var next = effectiveTheme() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { window.localStorage.setItem("maop-docs-theme", next); } catch (e) { /* not persisted */ }
        syncThemeButton();
        live.textContent = next === "dark" ? "Dark theme" : "Light theme";
      });
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) { mq.addEventListener("change", syncThemeButton); }
      }
      syncThemeButton();

      // Mobile navigation.
      var menuBtn = document.getElementById("menu-btn");
      menuBtn.addEventListener("click", function () {
        var open = document.body.classList.toggle("nav-open");
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });

      // Render Markdown.
      var md = document.getElementById("source").textContent.replace(/<\\\/script/g, "<" + "/script");
      var main = document.getElementById("content");
      if (!window.marked) {
        var raw = document.createElement("pre");
        raw.textContent = md;
        main.appendChild(raw);
        return;
      }
      main.innerHTML = window.marked.parse(md, { gfm: true });

      // Callouts: a blockquote starting with "Not yet verified" or "Warning" gets the warning style.
      main.querySelectorAll("blockquote").forEach(function (q) {
        if (/^\s*(not yet verified|unverified|warning)/i.test(q.textContent)) { q.classList.add("warn"); }
      });

      // Mermaid blocks into diagram cards; other code blocks get a copy button.
      main.querySelectorAll("pre > code").forEach(function (code) {
        var pre = code.parentNode;
        if (code.classList.contains("language-mermaid")) {
          var card = document.createElement("div");
          card.className = "diagram";
          var m = document.createElement("pre");
          m.className = "mermaid";
          m.textContent = code.textContent;
          card.appendChild(m);
          pre.replaceWith(card);
          return;
        }
        var wrap = document.createElement("div");
        wrap.className = "code-block";
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        pre.setAttribute("tabindex", "0");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.setAttribute("aria-label", "Copy code to clipboard");
        btn.addEventListener("click", function () {
          var text = code.textContent.replace(/\n$/, "");
          function done(ok) {
            btn.textContent = ok ? "Copied" : "Selected";
            btn.classList.toggle("copied", ok);
            if (!ok) {
              // Leave the code selected so it can be copied with the keyboard.
              var range = document.createRange();
              range.selectNodeContents(code);
              var sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
            }
            live.textContent = ok ? "Copied to clipboard" : "Clipboard unavailable; the code is selected, copy it with the keyboard";
            setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1800);
          }
          function legacyCopy() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            done(ok);
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, legacyCopy);
          } else {
            legacyCopy();
          }
        });
        wrap.appendChild(btn);
      });

      // Heading ids and permalinks.
      main.querySelectorAll("h1, h2, h3, h4").forEach(function (h) {
        if (!h.id) {
          h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]+/g, "").replace(/\s+/g, "-");
        }
        if (h.tagName !== "H1") {
          var a = document.createElement("a");
          a.className = "anchor";
          a.href = "#" + h.id;
          a.textContent = "#";
          a.setAttribute("aria-label", "Link to this section");
          h.appendChild(a);
        }
      });

      // External links open normally; links to other sites get rel=noopener for safety.
      main.querySelectorAll('a[href^="http"]').forEach(function (a) { a.setAttribute("rel", "noopener"); });

      function scrollToHash() {
        if (location.hash) {
          var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          if (target) { target.scrollIntoView(); }
        }
      }

      if (window.mermaid && main.querySelector("pre.mermaid")) {
        // Diagrams sit on a light "paper" card in both themes; hand-drawn diagrams carry their own init.
        window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" });
        // Wide diagrams are not shrunk below 70 % of their natural width: they scroll inside their card
        // instead, so labels stay legible and the page itself never scrolls horizontally.
        var sizeDiagrams = function () {
          main.querySelectorAll(".diagram svg").forEach(function (svg) {
            var natural = parseFloat(svg.style.maxWidth);
            if (!natural) { return; }
            var avail = svg.closest(".diagram").clientWidth - 32;
            var width = Math.min(natural, Math.max(avail, natural * 0.7));
            svg.style.width = width + "px";
            svg.style.maxWidth = "none";
          });
        };
        window.mermaid.run({ querySelector: "pre.mermaid" }).then(function () {
          sizeDiagrams();
          scrollToHash();
        }, function (err) {
          if (window.console) { console.warn("Mermaid rendering failed", err); }
          scrollToHash();
        });
      } else {
        scrollToHash();
      }
    })();
  </script>
</body>
</html>
