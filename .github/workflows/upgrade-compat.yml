# Scheduled compatibility check for everything Dependabot cannot do correctly
# (docs/dependency-maintenance.md §5.3). Owns: Quarkus stream changes, Helm chart pins in
# deploy/platform/versions.env, the Maven Wrapper, the Node.js toolchain (see .github/upgrade-ownership.yml).
#
# - Discovery and the standing report need only GITHUB_TOKEN (issues: write for the report).
# - Pull requests are created with secrets.UPGRADE_BOT_TOKEN (fine-grained PAT or GitHub App
#   token with contents: write + pull-requests: write), because PRs created with GITHUB_TOKEN do
#   not trigger CI. Without that secret the workflow runs in report-only mode.
# - Each concern uses one fixed branch; peter-evans/create-pull-request updates the open PR on
#   that branch in place, so repeated runs never open duplicates.
# - Never uses model credentials or cluster tokens.
# - Scripts write results to $RUNNER_TEMP/maintenance (lib.sh default inside Actions).
name: upgrade-compat

on:
  schedule:
    - cron: "30 5 * * *" # every day, weekends included (UTC)
  workflow_dispatch:
    inputs:
      allow-prerelease:
        description: "Consider pre-release Quarkus/chart versions"
        type: boolean
        default: false
      dry-run:
        description: "Report only: never push branches or open PRs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upgrade-compat
  cancel-in-progress: false

env:
  ALLOW_PRERELEASE: ${{ inputs.allow-prerelease && 'true' || 'false' }}
  DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
  BOT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}
      current_version: ${{ steps.quarkus.outputs.current_version }}
      newer_lts_available: ${{ steps.quarkus.outputs.newer_lts_available }}
      newest_lts_version: ${{ steps.quarkus.outputs.newest_lts_version }}
      newest_lts_stream: ${{ steps.quarkus.outputs.newest_lts_stream }}
      quarkus_level: ${{ steps.quarkus.outputs.upgrade_level }}
      charts_updates: ${{ steps.charts.outputs.updates_available }}
      charts_level: ${{ steps.charts.outputs.bump_level }}
      wrapper_update: ${{ steps.wrapper.outputs.update_available }}
      wrapper_latest: ${{ steps.wrapper.outputs.latest }}
      wrapper_level: ${{ steps.wrapper.outputs.bump_level }}
      node_update: ${{ steps.node.outputs.update_available }}
      node_drift: ${{ steps.node.outputs.drift }}
      node_latest_major: ${{ steps.node.outputs.latest_lts_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PR token available?
        id: token
        env:
          UPGRADE_BOT_TOKEN: ${{ secrets.UPGRADE_BOT_TOKEN }}
        run: |
          if [ -n "$UPGRADE_BOT_TOKEN" ]; then echo "has_token=true"; else echo "has_token=false"; fi >>"$GITHUB_OUTPUT"
      - name: Quarkus platform
        id: quarkus
        run: scripts/maintenance/quarkus-platform-check.sh
      - name: Platform member BOM and independent libraries
        env:
          CANDIDATE_VERSION: ${{ steps.quarkus.outputs.newest_lts_version }}
        run: scripts/maintenance/extension-compat-check.sh
      - name: Helm chart pins
        id: charts
        run: scripts/maintenance/chart-pin-check.sh
      - name: Maven Wrapper
        id: wrapper
        run: scripts/maintenance/maven-wrapper-check.sh
      - name: Node.js toolchain
        id: node
        run: scripts/maintenance/node-toolchain-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-check
          path: ${{ runner.temp }}/maintenance/*.md
          retention-days: 14

  stream-upgrade-pr:
    needs: check
    if: needs.check.outputs.newer_lts_available == 'true' && needs.check.outputs.has_token == 'true' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
      skipped: ${{ steps.dup.outputs.skip }}
      verify_status: ${{ steps.upgrade.outputs.verify_status }}
    env:
      TARGET_VERSION: ${{ needs.check.outputs.newest_lts_version }}
      TARGET_STREAM: ${{ needs.check.outputs.newest_lts_stream }}
      LEVEL: ${{ needs.check.outputs.quarkus_level }}
    steps:
      - name: Skip if Dependabot already proposes this version
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          n="$(gh pr list --repo "$REPO" --state open --author app/dependabot \
                --search "$TARGET_VERSION in:title" --json number --jq 'length')"
          if [ "$n" != "0" ]; then echo "skip=true" >>"$GITHUB_OUTPUT"; echo "Dependabot PR open for $TARGET_VERSION"; else echo "skip=false" >>"$GITHUB_OUTPUT"; fi
      - if: steps.dup.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.dup.outputs.skip == 'false'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Quarkus update tooling + build/test
        id: upgrade
        if: steps.dup.outputs.skip == 'false'
        env:
          MAOP_MODEL_MODE: deterministic
        run: scripts/maintenance/quarkus-stream-upgrade.sh "$TARGET_VERSION" "$TARGET_STREAM"
      - name: Upload logs
        if: always() && steps.dup.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarkus-stream-upgrade-logs
          path: ${{ runner.temp }}/maintenance/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Labels for this level
        id: labels
        if: steps.dup.outputs.skip == 'false'
        run: |
          if [ "$LEVEL" = "minor" ]; then
            echo "add=dependencies,quarkus-stream,automerge:eligible" >>"$GITHUB_OUTPUT"; echo "remove=needs-review" >>"$GITHUB_OUTPUT"
          else
            echo "add=dependencies,quarkus-stream,needs-review" >>"$GITHUB_OUTPUT"; echo "remove=automerge:eligible" >>"$GITHUB_OUTPUT"
          fi
      - name: Open or update the PR on upgrade/quarkus-stream
        id: pr
        if: steps.dup.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPGRADE_BOT_TOKEN }}
          branch: upgrade/quarkus-stream
          base: ${{ github.event.repository.default_branch }}
          title: Upgrade Quarkus platform to ${{ env.TARGET_STREAM }} LTS
          commit-message: Upgrade Quarkus platform to ${{ env.TARGET_STREAM }} LTS (${{ env.TARGET_VERSION }})
          body-path: ${{ runner.temp }}/maintenance/stream-upgrade.md
          labels: ${{ steps.labels.outputs.add }}
          author: ${{ env.BOT_AUTHOR }}
          committer: ${{ env.BOT_AUTHOR }}
          delete-branch: false
      - name: Remove the opposite level label
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_BOT_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-url }}
          REMOVE: ${{ steps.labels.outputs.remove }}
        run: gh pr edit "$PR" --remove-label "$REMOVE" >/dev/null || true

  charts-pr:
    needs: check
    if: needs.check.outputs.charts_updates == 'true' && needs.check.outputs.has_token == 'true' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      LEVEL: ${{ needs.check.outputs.charts_level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update deploy/platform/versions.env
        run: scripts/maintenance/chart-pin-check.sh --apply
      - name: Labels for this level
        id: labels
        run: |
          case "$LEVEL" in
            patch|minor) echo "add=dependencies,platform-charts,automerge:eligible" >>"$GITHUB_OUTPUT"; echo "remove=needs-review" >>"$GITHUB_OUTPUT" ;;
            *) echo "add=dependencies,platform-charts,needs-review" >>"$GITHUB_OUTPUT"; echo "remove=automerge:eligible" >>"$GITHUB_OUTPUT" ;;
          esac
      - name: Open or update the PR on upgrade/platform-charts
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPGRADE_BOT_TOKEN }}
          branch: upgrade/platform-charts
          base: ${{ github.event.repository.default_branch }}
          title: Update pinned platform Helm charts
          commit-message: Update pinned platform Helm charts
          body-path: ${{ runner.temp }}/maintenance/charts.md
          labels: ${{ steps.labels.outputs.add }}
          author: ${{ env.BOT_AUTHOR }}
          committer: ${{ env.BOT_AUTHOR }}
          add-paths: |
            deploy/platform/**
          delete-branch: false
      - name: Remove the opposite level label
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_BOT_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-url }}
          REMOVE: ${{ steps.labels.outputs.remove }}
        run: gh pr edit "$PR" --remove-label "$REMOVE" >/dev/null || true

  wrapper-pr:
    needs: check
    if: needs.check.outputs.wrapper_update == 'true' && needs.check.outputs.has_token == 'true' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      LEVEL: ${{ needs.check.outputs.wrapper_level }}
      LATEST: ${{ needs.check.outputs.wrapper_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: mvnw wrapper:wrapper -Dmaven=<latest>
        run: scripts/maintenance/maven-wrapper-check.sh --apply
      - name: Labels for this level
        id: labels
        run: |
          case "$LEVEL" in
            patch|minor) echo "add=dependencies,maven-wrapper,automerge:eligible" >>"$GITHUB_OUTPUT"; echo "remove=needs-review" >>"$GITHUB_OUTPUT" ;;
            *) echo "add=dependencies,maven-wrapper,needs-review" >>"$GITHUB_OUTPUT"; echo "remove=automerge:eligible" >>"$GITHUB_OUTPUT" ;;
          esac
      - name: Open or update the PR on upgrade/maven-wrapper
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPGRADE_BOT_TOKEN }}
          branch: upgrade/maven-wrapper
          base: ${{ github.event.repository.default_branch }}
          title: Update Maven Wrapper to Maven ${{ env.LATEST }}
          commit-message: Update Maven Wrapper to Maven ${{ env.LATEST }}
          body-path: ${{ runner.temp }}/maintenance/maven-wrapper.md
          labels: ${{ steps.labels.outputs.add }}
          author: ${{ env.BOT_AUTHOR }}
          committer: ${{ env.BOT_AUTHOR }}
          add-paths: |
            .mvn/wrapper/**
            mvnw
            mvnw.cmd
          delete-branch: false
      - name: Remove the opposite level label
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.UPGRADE_BOT_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-url }}
          REMOVE: ${{ steps.labels.outputs.remove }}
        run: gh pr edit "$PR" --remove-label "$REMOVE" >/dev/null || true

  toolchain-pr:
    needs: check
    if: (needs.check.outputs.node_update == 'true' || needs.check.outputs.node_drift == 'true') && needs.check.outputs.has_token == 'true' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      TITLE: ${{ needs.check.outputs.node_update == 'true' && format('Update Node.js to {0} LTS', needs.check.outputs.node_latest_major) || 'Fix Node.js toolchain drift' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move the Node.js pins
        run: scripts/maintenance/node-toolchain-check.sh --apply
      # A Node.js major is a major upgrade: always reviewed by a person, never auto-merged.
      - name: Open or update the PR on upgrade/toolchain
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.UPGRADE_BOT_TOKEN }}
          branch: upgrade/toolchain
          base: ${{ github.event.repository.default_branch }}
          title: ${{ env.TITLE }}
          commit-message: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/maintenance/node-toolchain.md
          labels: dependencies,toolchain,needs-review
          author: ${{ env.BOT_AUTHOR }}
          committer: ${{ env.BOT_AUTHOR }}
          add-paths: |
            web/.nvmrc
            web/package.json
            web/package-lock.json
            README.md
            docs/tutorials/index.md
          delete-branch: false

  report:
    needs: [check, stream-upgrade-pr, charts-pr, wrapper-pr, toolchain-pr]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/maintenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-check
          path: ${{ runner.temp }}/maintenance
      - name: Summarise actions taken
        env:
          HAS_TOKEN: ${{ needs.check.outputs.has_token }}
          STREAM_NEEDED: ${{ needs.check.outputs.newer_lts_available }}
          CHARTS_NEEDED: ${{ needs.check.outputs.charts_updates }}
          WRAPPER_NEEDED: ${{ needs.check.outputs.wrapper_update }}
          STREAM_RESULT: ${{ needs.stream-upgrade-pr.result }}
          STREAM_PR: ${{ needs.stream-upgrade-pr.outputs.pr_url }}
          STREAM_SKIPPED: ${{ needs.stream-upgrade-pr.outputs.skipped }}
          STREAM_VERIFY: ${{ needs.stream-upgrade-pr.outputs.verify_status }}
          CHARTS_RESULT: ${{ needs.charts-pr.result }}
          CHARTS_PR: ${{ needs.charts-pr.outputs.pr_url }}
          WRAPPER_RESULT: ${{ needs.wrapper-pr.result }}
          WRAPPER_PR: ${{ needs.wrapper-pr.outputs.pr_url }}
          NODE_NEEDED: ${{ needs.check.outputs.node_update == 'true' || needs.check.outputs.node_drift == 'true' }}
          NODE_RESULT: ${{ needs.toolchain-pr.result }}
          NODE_PR: ${{ needs.toolchain-pr.outputs.pr_url }}
        run: |
          MAINT_OUT_DIR="$RUNNER_TEMP/maintenance"
          row() { # concern needed result pr extra
            if [ "$2" != "true" ]; then s="nothing to do"
            elif [ "$DRY_RUN" = "true" ]; then s="dry run: no PR"
            elif [ "$HAS_TOKEN" != "true" ]; then s="report-only mode: add UPGRADE_BOT_TOKEN (fine-grained PAT or GitHub App token with contents+pull-requests write) so PRs trigger CI"
            elif [ -n "$4" ]; then s="PR: $4 ${5:+($5)}"
            else s="job $3 ${5:+($5)}"; fi
            echo "| $1 | $s |"
          }
          {
            echo "### Actions taken"
            echo
            echo "| Concern | Result |"
            echo "| --- | --- |"
            extra=""
            [ "$STREAM_SKIPPED" = "true" ] && extra="skipped: an open Dependabot PR proposes the same version"
            [ -n "$STREAM_VERIFY" ] && extra="${extra:+$extra; }build/test: $STREAM_VERIFY"
            row "Quarkus stream (upgrade/quarkus-stream)" "$STREAM_NEEDED" "$STREAM_RESULT" "$STREAM_PR" "$extra"
            row "Helm charts (upgrade/platform-charts)" "$CHARTS_NEEDED" "$CHARTS_RESULT" "$CHARTS_PR" ""
            row "Maven Wrapper (upgrade/maven-wrapper)" "$WRAPPER_NEEDED" "$WRAPPER_RESULT" "$WRAPPER_PR" ""
            row "Node.js toolchain (upgrade/toolchain)" "$NODE_NEEDED" "$NODE_RESULT" "$NODE_PR" ""
            echo
          } >"$MAINT_OUT_DIR/actions.md"
          cat "$MAINT_OUT_DIR"/*.md >>"$GITHUB_STEP_SUMMARY"
      - name: Update the standing issue (closed when all clear, reopened when something needs action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/maintenance/report-issue.sh
