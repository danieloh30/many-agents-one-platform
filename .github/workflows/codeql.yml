# CodeQL code scanning (Java/Kotlin and JavaScript/TypeScript). Not part of compat-gate; results
# appear under Security > Code scanning. Code scanning on a private repository requires GitHub
# Advanced Security (GitHub Code Security); on a public repository it is free.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Uploading results needs GitHub Code Security on private repositories. Runs on public repositories, or
    # when the repository variable MAOP_CODE_SCANNING=true is set after enabling code scanning.
    if: ${{ !github.event.repository.private || vars.MAOP_CODE_SCANNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Compile (observed by CodeQL)
        run: ./mvnw -B -ntp -DskipTests compile
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
