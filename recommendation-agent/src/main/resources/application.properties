quarkus.application.name=recommendation-agent
# No public API: only the management interface (health, metrics) is exposed.
quarkus.http.host=127.0.0.1
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0
quarkus.shutdown.timeout=30s
maop.pod-name=${HOSTNAME:local}
maop.worker.concurrency=${MAOP_WORKER_CONCURRENCY:2}

maop.model.mode=${MAOP_MODEL_MODE:live}
maop.model.name=${MAOP_MODEL_NAME:gpt-4o-mini}
maop.model.max-concurrent=${MAOP_MODEL_MAX_CONCURRENT:1}
maop.model.call-timeout=20s
quarkus.langchain4j.openai.base-url=${MAOP_MODEL_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.api-key=${MAOP_MODEL_API_KEY:not-configured}
quarkus.langchain4j.openai.chat-model.model-name=${MAOP_MODEL_NAME:gpt-4o-mini}
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.chat-model.max-tokens=800
quarkus.langchain4j.openai.timeout=25s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.tracing.include-prompt=false
quarkus.langchain4j.tracing.include-completion=false

maop.spiffe.dir=${MAOP_SPIFFE_DIR:/spiffe}
maop.tool-service.url=${MAOP_TOOL_SERVICE_URL:https://tool-service:8443}
maop.tool-service.spiffe-id=${MAOP_TOOL_SERVICE_SPIFFE_ID:spiffe://maop.example/ns/maop/sa/tool-service}

maop.nats.url=${MAOP_NATS_URL:nats://localhost:4222}
maop.nats.user=${MAOP_NATS_USER:}
maop.nats.password=${MAOP_NATS_PASSWORD:}
quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.namespace=maop
quarkus.log.console.json=${MAOP_LOG_JSON:false}

%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.traces.exporter=none
%test.maop.model.mode=deterministic
