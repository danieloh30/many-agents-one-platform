# Profile "dev": smaller requests for the five Java services (container 0) so the stack fits a
# laptop-sized kind cluster. demo.sh adds this component for `--profile dev`; replica bounds come
# from MAOP_EVIDENCE_MAX_REPLICAS / the profile minimum in the generated kustomization.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(triage-agent|evidence-worker|recommendation-agent|tool-service|ops-console)$"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
