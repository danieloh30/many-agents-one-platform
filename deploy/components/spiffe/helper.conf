# spiffe-helper 0.12.3 configuration (HCL). Keys verified against the v0.12.3 README and
# cmd/spiffe-helper/config/config.go.
#
# Daemon mode without cmd/pid_file_name: the helper fetches the X.509-SVID, key and bundle,
# rewrites them before expiry, and signals nobody. Quarkus' TLS registry re-reads the PEM files
# (quarkus.tls.spiffe.reload-period=30S, docs/security.md §3.2).
#
# agent_address: the SPIFFE CSI driver mounts the SPIRE agent's socket directory at
# /spiffe-workload-api. The upstream SPIRE chart names the socket spire-agent.sock. With an
# existing SPIRE/ZTWIM install that uses a different socket name, override MAOP_SPIFFE_SOCKET_NAME
# (demo.sh regenerates this file).
agent_address = "/spiffe-workload-api/spire-agent.sock"
cmd = ""
cmd_args = ""
cert_dir = "/spiffe"
daemon_mode = true
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "svid_bundle.pem"

# /ready returns 200 only after the X.509 files have been written; the sidecar's startupProbe uses
# it, so the application container starts only once the first SVID is on disk.
health_checks {
  listener_enabled = true
  bind_port = 8081
  liveness_path = "/live"
  readiness_path = "/ready"
}
