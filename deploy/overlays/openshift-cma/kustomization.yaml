# OpenShift variant for clusters that run the Custom Metrics Autoscaler (CMA) operator
# (docs/deployment.md §5.1). Upstream KEDA must never be installed next to CMA, and CMA does not
# list the nats-jetstream trigger, so the ScaledObject uses a prometheus trigger against the
# in-namespace Prometheus instead. The query uses the evidence consumer's backlog as exported by
# the application (pending + ack pending = same "lag" the nats-jetstream scaler uses).
#
# The in-namespace Prometheus is unauthenticated, so no TriggerAuthentication is needed. (A
# TriggerAuthentication would only be required for an authenticated Prometheus such as the
# OpenShift monitoring stack's Thanos querier.)
#
# serverAddress: demo.sh replaces the namespace segment with the ScaledObject's namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../openshift
  - network-cma.yaml

patches:
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: evidence-worker
    patch: |-
      - op: replace
        path: /spec/triggers
        value:
          - type: prometheus
            metadata:
              serverAddress: http://prometheus.maop.svc:9090
              query: sum(maop_queue_pending{consumer="evidence-workers"}) + sum(maop_queue_ack_pending{consumer="evidence-workers"})
              threshold: "4"
              activationThreshold: "0"
