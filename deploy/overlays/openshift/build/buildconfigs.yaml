# In-cluster binary Docker builds (docs/deployment.md §5.3). Applied by `./demo.sh build` into the
# app namespace; `oc start-build <svc> --from-dir=<module> --follow --wait` uploads the module
# directory (with target/quarkus-app/ already built by Maven) as the build context.
# Deployments reference the resulting image by digest (demo.sh), so no image change triggers are used.
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: maop-triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
spec:
  lookupPolicy:
    local: false
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
spec:
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: src/main/docker/Dockerfile.jvm
  output:
    to:
      kind: ImageStreamTag
      name: maop-triage-agent:latest
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
---
