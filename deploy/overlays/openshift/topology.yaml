# OpenShift topology view: runtime icons (app.openshift.io/runtime) and connectors (app.openshift.io/connects-to).
# Only built-in console icons exist; Jaeger, Prometheus, Grafana, NATS and the OTel Collector have no dedicated
# icon, so they use 'golang' (the language they are written in). Workload metadata only: no pod restarts.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  labels:
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"triage-agent"},{"apiVersion":"apps/v1","kind":"Deployment","name":"tool-service"},{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
    app.openshift.io/vcs-uri: https://github.com/danieloh30/many-agents-one-platform
    app.openshift.io/vcs-ref: main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  labels:
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"StatefulSet","name":"postgres"},{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"tool-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
    app.openshift.io/vcs-uri: https://github.com/danieloh30/many-agents-one-platform
    app.openshift.io/vcs-ref: main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-worker
  labels:
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"tool-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
    app.openshift.io/vcs-uri: https://github.com/danieloh30/many-agents-one-platform
    app.openshift.io/vcs-ref: main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-agent
  labels:
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"tool-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
    app.openshift.io/vcs-uri: https://github.com/danieloh30/many-agents-one-platform
    app.openshift.io/vcs-ref: main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-service
  labels:
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"StatefulSet","name":"postgres"},{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
    app.openshift.io/vcs-uri: https://github.com/danieloh30/many-agents-one-platform
    app.openshift.io/vcs-ref: main
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.openshift.io/runtime: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.openshift.io/runtime: golang
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.openshift.io/runtime: golang
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"jaeger"}]'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.openshift.io/runtime: golang
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.openshift.io/runtime: golang
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"triage-agent"},{"apiVersion":"apps/v1","kind":"Deployment","name":"evidence-worker"},{"apiVersion":"apps/v1","kind":"Deployment","name":"recommendation-agent"},{"apiVersion":"apps/v1","kind":"Deployment","name":"tool-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"ops-console"},{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nats"},{"apiVersion":"apps/v1","kind":"Deployment","name":"otel-collector"}]'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.openshift.io/runtime: golang
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"prometheus"},{"apiVersion":"apps/v1","kind":"Deployment","name":"jaeger"}]'
