# Ingresses for a generic cluster / kind. Hosts are <name>.<MAOP_INGRESS_DOMAIN>; demo.sh
# replaces the domain (default 127.0.0.1.nip.io) and the ingress class (MAOP_INGRESS_CLASS, cluster
# default when unset). jaeger, grafana and prometheus are removed when MAOP_EXPOSE_OBSERVABILITY=false.
# SSE: ingress-nginx needs long read timeouts and no buffering for /api/v1/stream.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-console
  labels:
    app.kubernetes.io/name: ops-console
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: console.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-console
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  rules:
    - host: jaeger.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  name: query
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  rules:
    - host: grafana.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  rules:
    - host: prometheus.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  name: http
