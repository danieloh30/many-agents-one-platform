# NATS server 2.15 configuration. Streams and consumers are provisioned by the Java services at
# startup (maop-common JetStream adapter), so there is no setup Job.
#
# Passwords are not in this file: `$NAME` references that are not defined in the file are resolved
# from the environment (NATS configuration "variables"), and the environment comes from Secret
# nats-auth. demo.sh generates the passwords as a letter followed by hex digits so the config
# parser always reads them as strings.

server_name: maop-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 128M
  max_file_store: 1800M
}

# Subject-level permissions (docs/security.md §3.3). Only triage-agent publishes commands to the
# work stream; the console never publishes events or dead letters.
authorization {
  users: [
    { user: "triage-agent", password: $TRIAGE_AGENT_PASSWORD }
    {
      user: "evidence-agent", password: $EVIDENCE_AGENT_PASSWORD
      permissions: { publish: { deny: ["maop.work.>"] } }
    }
    {
      user: "recommendation-agent", password: $RECOMMENDATION_AGENT_PASSWORD
      permissions: { publish: { deny: ["maop.work.>"] } }
    }
    {
      user: "tool-service", password: $TOOL_SERVICE_PASSWORD
      permissions: { publish: { deny: ["maop.work.>"] } }
    }
    {
      user: "ops-console", password: $OPS_CONSOLE_PASSWORD
      permissions: { publish: { deny: ["maop.work.>", "maop.events.>", "maop.dlq.>"] } }
    }
  ]
}
