# Prometheus v3.16 — namespaced service discovery only (Role in rbac.yaml, own_namespace: true),
# so nothing outside the demo namespace is listed or scraped.
#
# Scraped: every pod annotated prometheus.io/scrape="true", at prometheus.io/port and
# prometheus.io/path — the five services (9000 /q/metrics), the NATS exporter (7777 /metrics),
# the Collector's span metrics (8889 /metrics). OPA's /metrics listens on 127.0.0.1 only and is
# not scraped. Run IDs are never labels; target labels are reduced to namespace, pod, app.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: maop-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Pending|Succeeded|Failed)
      # One target per pod: address = pod IP + annotated port (the pod role emits one candidate per
      # container port; identical results are de-duplicated by Prometheus).
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
