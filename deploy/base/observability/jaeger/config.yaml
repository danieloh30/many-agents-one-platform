# Jaeger v2.23.0 all-in-one with the bounded in-memory store. Structure follows
# cmd/jaeger/config.yaml at tag v2.23.0, reduced to OTLP in, memory storage, query UI/API.
# jaeger_query http/grpc endpoint keys verified in
# cmd/jaeger/internal/extension/jaegerquery/internal/config.go (v2.23.0).
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: memstore
    # Jaeger tracing itself would add noise to the demo trace view.
    enable_tracing: false
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      memstore:
        memory:
          max_traces: 20000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memstore
