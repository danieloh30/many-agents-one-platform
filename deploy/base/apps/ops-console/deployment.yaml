apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console
  labels:
    app.kubernetes.io/name: ops-console
    app.kubernetes.io/component: console
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-console
        app.kubernetes.io/component: console
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /q/metrics
    spec:
      serviceAccountName: ops-console
      # The only workload with an API token: read-only Role in its own namespace (rbac.yaml).
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Container 0 must stay the application container: the spiffe component patches index 0.
        - name: ops-console
          image: maop-ops-console:0.0.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: maop-config
            - configMapRef:
                name: ops-console-config
          env:
            - name: MAOP_TRIAGE_URL
              value: http://triage-agent:8080
            - name: MAOP_PRESENTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-console-presenter
                  key: token
            - name: MAOP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAOP_KUBERNETES_ENABLED
              value: "true"
            - name: MAOP_NATS_USER
              value: ops-console
            - name: MAOP_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: ops-console
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
