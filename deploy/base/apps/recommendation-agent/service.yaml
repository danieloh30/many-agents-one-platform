apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendation-agent
  labels:
    app.kubernetes.io/name: recommendation-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-agent
  labels:
    app.kubernetes.io/name: recommendation-agent
spec:
  selector:
    app.kubernetes.io/name: recommendation-agent
  ports:
    - name: management
      port: 9000
      targetPort: management
