apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-worker
  labels:
    app.kubernetes.io/name: evidence-worker
automountServiceAccountToken: false
---
# Management port only (health/metrics); the worker has no request API.
apiVersion: v1
kind: Service
metadata:
  name: evidence-worker
  labels:
    app.kubernetes.io/name: evidence-worker
spec:
  selector:
    app.kubernetes.io/name: evidence-worker
  ports:
    - name: management
      port: 9000
      targetPort: management
