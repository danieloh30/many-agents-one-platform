apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-agent
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /q/metrics
    spec:
      serviceAccountName: triage-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Container 0 must stay the application container: the spiffe component patches index 0.
        - name: triage-agent
          image: maop-triage-agent:0.0.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: maop-config
            - configMapRef:
                name: model-config
          env:
            - name: MAOP_NATS_USER
              value: triage-agent
            - name: MAOP_NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: triage-agent
            - name: QUARKUS_DATASOURCE_USERNAME
              value: triage
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-roles
                  key: triage-password
            - name: MAOP_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: model-credentials
                  key: MAOP_MODEL_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
