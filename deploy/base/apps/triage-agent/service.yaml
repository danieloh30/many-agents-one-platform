apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: triage-agent
  labels:
    app.kubernetes.io/name: triage-agent
spec:
  selector:
    app.kubernetes.io/name: triage-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
