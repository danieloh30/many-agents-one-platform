# OPA configuration (docs/security.md §4.4). Keys checked against the OPA configuration reference:
# decision_logs.console, status.prometheus, distributed_tracing.{type,address,service_name,encryption}.
decision_logs:
  console: true
status:
  prometheus: true
distributed_tracing:
  type: grpc
  address: otel-collector:4317
  service_name: opa
  sample_percentage: 100
  encryption: "off"
