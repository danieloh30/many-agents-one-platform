# Rerunnable: Job templates are immutable, so demo.sh deletes this Job before every apply and waits
# for the new one to complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-setup
  labels:
    app.kubernetes.io/name: postgres-setup
    app.kubernetes.io/component: database
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-setup
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: quay.io/sclorg/postgresql-18-c9s:20261111
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              until pg_isready -h postgres -p 5432 -q; do echo "waiting for postgres"; sleep 2; done
              exec psql -h postgres -p 5432 -U postgres -d maop -X -q \
                -v triage_pw="$TRIAGE_PASSWORD" -v tools_pw="$TOOLS_PASSWORD" \
                -f /setup/setup.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: admin-password
            - name: TRIAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-roles
                  key: triage-password
            - name: TOOLS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-roles
                  key: tools-password
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: setup
              mountPath: /setup
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: setup
          configMap:
            name: postgres-setup
        - name: tmp
          emptyDir: {}
