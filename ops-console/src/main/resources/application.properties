quarkus.application.name=ops-console
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0

maop.profile=${MAOP_PROFILE:summit}
maop.presenter-token=${MAOP_PRESENTER_TOKEN:}
# Presenter token for mutations: off by default (MAOP_PRESENTER_AUTH=true to require it).
maop.presenter-auth.enabled=${MAOP_PRESENTER_AUTH:false}
maop.triage.url=${MAOP_TRIAGE_URL:http://triage-agent:8080}
maop.trust-domain=${MAOP_TRUST_DOMAIN:maop.example}
maop.identity.mode=${MAOP_IDENTITY_MODE:SPIFFE}
maop.links.jaeger=${MAOP_JAEGER_URL:}
maop.links.grafana=${MAOP_GRAFANA_URL:}
# External Prometheus UI for the console link (MAOP_PROMETHEUS_URL is the internal address the console queries).
maop.links.prometheus=${MAOP_PROMETHEUS_EXTERNAL_URL:}
maop.jaeger.internal-url=${MAOP_JAEGER_INTERNAL_URL:http://jaeger:16686}
maop.grafana.internal-url=${MAOP_GRAFANA_INTERNAL_URL:http://grafana:3000}
maop.prometheus.url=${MAOP_PROMETHEUS_URL:http://prometheus:9090}
maop.namespace=${MAOP_NAMESPACE:maop}
maop.kubernetes.enabled=${MAOP_KUBERNETES_ENABLED:false}
maop.evidence.min-replicas=${MAOP_EVIDENCE_MIN_REPLICAS:1}
maop.evidence.max-replicas=${MAOP_EVIDENCE_MAX_REPLICAS:6}
quarkus.kubernetes-client.devservices.enabled=false
quarkus.kubernetes-client.namespace=${MAOP_NAMESPACE:maop}

maop.spiffe.dir=${MAOP_SPIFFE_DIR:/spiffe}
maop.tool-service.url=${MAOP_TOOL_SERVICE_URL:https://tool-service:8443}
maop.tool-service.spiffe-id=${MAOP_TOOL_SERVICE_SPIFFE_ID:spiffe://maop.example/ns/maop/sa/tool-service}

maop.nats.url=${MAOP_NATS_URL:nats://localhost:4222}
maop.nats.user=${MAOP_NATS_USER:}
maop.nats.password=${MAOP_NATS_PASSWORD:}
# The console only reads: it never provisions streams (it has no publish permission on maop.>).
maop.nats.provision=false

# Keep the collector gRPC transport explicit (Quarkus 4 defaults to HTTP/protobuf).
%prod.quarkus.otel.exporter.otlp.protocol=grpc
%prod.quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# Every demo run must have a connected trace; Quarkus 4 defaults to 10% sampling.
quarkus.otel.traces.sampler=parentbased_always_on
# Prometheus owns metrics; the collector pipeline accepts traces only.
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.resource.attributes=service.namespace=maop
quarkus.micrometer.binder.http-server.match-patterns=/api/v1/runs/[^/]+/timeline=/api/v1/runs/{id}/timeline,/api/v1/runs/[^/]+/approval=/api/v1/runs/{id}/approval,/api/v1/runs/[^/]+/cancel=/api/v1/runs/{id}/cancel,/api/v1/runs/[^/]+=/api/v1/runs/{id},/api/v1/audit/invocations/.+=/api/v1/audit/invocations/{id},/runs/.+=/runs/{spa}
quarkus.log.console.json=${MAOP_LOG_JSON:false}

# Security headers for the SPA and API (same origin; Jaeger/Grafana open in new tabs, never embedded).
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."X-Frame-Options".value=DENY

# SPA caching. The static handler's default (public, immutable, max-age=86400 on every file, index.html included)
# kept a browser on the previous console for a day after a redeploy. index.html must be revalidated; only the
# content-hashed files under /assets/ may be cached as immutable.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.spa-index.matches=/(index\\.html)?
quarkus.http.filter.spa-index.header."Cache-Control"=no-cache
quarkus.http.filter.spa-assets.matches=/assets/.+
quarkus.http.filter.spa-assets.header."Cache-Control"=public, max-age=31536000, immutable

%test.quarkus.otel.traces.exporter=none

%test.quarkus.management.test-port=0
%test.quarkus.http.test-port=0
# quarkus:dev starts the Grafana LGTM Dev Service (Grafana, Prometheus, Tempo, Loki; port in the log and Dev UI). Off in tests.
