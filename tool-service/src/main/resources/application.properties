quarkus.application.name=tool-service
maop.trust-domain=${MAOP_TRUST_DOMAIN:maop.example}
maop.spiffe.dir=${MAOP_SPIFFE_DIR:/spiffe}
maop.opa.url=${MAOP_OPA_URL:http://127.0.0.1:8181}

# --- mTLS-only API: the X.509-SVID written by spiffe-helper, reloaded on rotation ---------
quarkus.tls.spiffe.key-store.pem.0.cert=${maop.spiffe.dir}/svid.pem
quarkus.tls.spiffe.key-store.pem.0.key=${maop.spiffe.dir}/svid_key.pem
quarkus.tls.spiffe.trust-store.pem.certs=${maop.spiffe.dir}/svid_bundle.pem
quarkus.tls.spiffe.reload-period=30S
quarkus.http.tls-configuration-name=spiffe
quarkus.http.ssl-port=8443
quarkus.http.ssl.client-auth=required
quarkus.http.insecure-requests=disabled

# Health and metrics on a separate plain-HTTP management interface (never the tool API).
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0

# --- persistence ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=tools
quarkus.datasource.jdbc.max-size=16
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=tools
quarkus.flyway.default-schema=tools
quarkus.flyway.create-schemas=true
quarkus.flyway.locations=db/common,db/migration
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.1

# --- messaging and telemetry ---------------------------------------------------------------
maop.nats.url=${MAOP_NATS_URL:nats://localhost:4222}
maop.nats.user=${MAOP_NATS_USER:}
maop.nats.password=${MAOP_NATS_PASSWORD:}
quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.namespace=maop
quarkus.micrometer.binder.http-server.match-patterns=/v1/tools/[^/]+/invocations=/v1/tools/{tool}/invocations,/v1/invocations/.+=/v1/invocations/{id},/v1/approvals/.+=/v1/approvals/{id}
quarkus.log.console.json=${MAOP_LOG_JSON:false}

%test.quarkus.otel.sdk.disabled=false
%test.quarkus.otel.traces.exporter=none
%dev.quarkus.otel.sdk.disabled=true

%test.quarkus.management.test-port=0
