quarkus.application.name=triage-agent
quarkus.http.port=8080
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0
quarkus.shutdown.timeout=40s

# --- model (server-side only; never sent to the browser) -----------------------------------
maop.model.mode=${MAOP_MODEL_MODE:live}
# Display name always follows the model actually called.
maop.model.name=${quarkus.langchain4j.openai.chat-model.model-name}
maop.model.max-concurrent=${MAOP_MODEL_MAX_CONCURRENT:2}
maop.model.call-timeout=20s
quarkus.langchain4j.openai.base-url=${MAOP_MODEL_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.api-key=${MAOP_MODEL_API_KEY:${OPENAI_API_KEY:not-configured}}
quarkus.langchain4j.openai.chat-model.model-name=${MAOP_MODEL_NAME:gpt-4o-mini}
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.chat-model.max-tokens=800
quarkus.langchain4j.openai.timeout=25s
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.tracing.include-prompt=false
quarkus.langchain4j.tracing.include-completion=false

# --- workflow limits -----------------------------------------------------------------------
maop.run.deadline=120s
maop.run.approval-window=10m
maop.limits.max-active-runs=${MAOP_MAX_ACTIVE_RUNS:25}
maop.limits.max-runs-per-hour=${MAOP_MAX_RUNS_PER_HOUR:120}
maop.burst.max-runs=${MAOP_BURST_MAX_RUNS:12}
maop.fault-injection.enabled=${MAOP_FAULT_INJECTION_ENABLED:true}

# --- tool-service over SPIFFE mTLS (approval grants) ---------------------------------------
maop.spiffe.dir=${MAOP_SPIFFE_DIR:/spiffe}
maop.tool-service.url=${MAOP_TOOL_SERVICE_URL:https://tool-service:8443}
maop.tool-service.spiffe-id=${MAOP_TOOL_SERVICE_SPIFFE_ID:spiffe://maop.example/ns/maop/sa/tool-service}

# --- persistence ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=triage
quarkus.datasource.jdbc.max-size=20
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=triage
quarkus.flyway.default-schema=triage
quarkus.flyway.create-schemas=true
quarkus.flyway.locations=db/common,db/migration
quarkus.datasource.devservices.image-name=docker.io/library/postgres:18.1

# --- messaging and telemetry ---------------------------------------------------------------
maop.nats.url=${MAOP_NATS_URL:nats://localhost:4222}
maop.nats.user=${MAOP_NATS_USER:}
maop.nats.password=${MAOP_NATS_PASSWORD:}
%prod.quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.resource.attributes=service.namespace=maop
quarkus.micrometer.binder.http-server.match-patterns=/v1/runs/[^/]+/timeline=/v1/runs/{id}/timeline,/v1/runs/[^/]+/approval=/v1/runs/{id}/approval,/v1/runs/[^/]+/cancel=/v1/runs/{id}/cancel,/v1/runs/[^/]+=/v1/runs/{id}
quarkus.log.console.json=${MAOP_LOG_JSON:false}

%test.quarkus.otel.traces.exporter=none
%test.maop.model.mode=deterministic

%test.quarkus.management.test-port=0
%test.quarkus.http.test-port=0
# quarkus:dev starts the Grafana LGTM Dev Service (Grafana, Prometheus, Tempo, Loki; port in the log and Dev UI). Off in tests.
